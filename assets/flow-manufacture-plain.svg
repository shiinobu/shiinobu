<circle cx="34" cy="142" r="9" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="34" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f1f1f">3</text>
<text x="56" y="138" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1f1f" text-anchor="start" xml:space="preserve">Auth</text>
<text x="210" y="138" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">app/middleware</tspan></text>
<text x="56" y="155" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start" xml:space="preserve">checks the JWT (HS256) on every <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">/api</tspan> route</text>
