<text x="210" y="192" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">app/controllers/&lt;domain&gt;</tspan></text>
