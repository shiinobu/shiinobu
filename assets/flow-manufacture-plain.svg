<text x="56" y="263" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start" xml:space="preserve">queries, JWT helper, JSON responses</text>
<rect x="10" y="280" width="580" height="48" rx="2" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2"/>
<circle cx="34" cy="304" r="9" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="34" y="308" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f1f1f">6</text>
<text x="56" y="300" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1f1f" text-anchor="start" xml:space="preserve">MySQL</text>
<text x="210" y="300" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">app/helpers/database.go</tspan></text>
