<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 370" width="100%" height="100%">
  <defs>
    <filter id="glow-yellow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&amp;family=Inter:wght@400;600;800&amp;display=swap');

    .bg { fill: #0a0c10; }

    .vertical-line-accent {
      stroke: #FFD700;
      stroke-width: 4;
      stroke-linecap: round;
      animation: pulse-line 2.5s infinite alternate ease-in-out;
    }
    
    .divider-line {
      stroke: #586069;
      stroke-width: 3.5;
      stroke-dasharray: 8 6;
    }

    .flow-dot {
      fill: #FFD700;
      filter: url(#glow-yellow);
    }

    .name-heading { 
      font-family: 'Inter', sans-serif; 
      font-size: 26.5px; 
      font-weight: 800; 
      fill: #ffffff; 
      letter-spacing: -0.3px; 
    }

    /* Diperbesar proporsional dari 18.5px ke 24.5px */
    .title-sub { 
      font-family: 'Inter', sans-serif; 
      font-size: 24.5px; 
      font-weight: 700; 
      fill: #FFD700; 
      letter-spacing: 0.5px; 
      filter: url(#glow-yellow); 
    }
    
    /* Diperbesar proporsional dari 11.5px ke 15.5px */
    .tree-text { 
      font-family: 'Fira Code', monospace; 
      font-size: 15.5px; 
      font-weight: 600; 
      fill: #8b949e; 
      letter-spacing: 0.3px; 
    }
    .tree-folder { fill: #56b6c2; font-weight: 700; }

    .sub-footer { 
      font-family: 'Fira Code', monospace; 
      font-size: 11px; 
      fill: #484f58; 
      letter-spacing: 1.5px; 
    }

    .path-title { font-family: 'Fira Code', monospace; font-size: 12px; font-weight: 500; fill: #5c6370; }
    .line-num { font-family: 'Fira Code', monospace; font-size: 14px; font-weight: 500; fill: #4b5363; text-anchor: end; }
    .code-text { font-family: 'Fira Code', monospace; font-size: 15px; font-weight: 500; fill: #abb2bf; }

    .kw-pink { fill: #ff79c6; }
    .type-yellow { fill: #e5c07b; }
    .field-orange { fill: #d19a66; }
    .type-cyan { fill: #56b6c2; }
    .str-green { fill: #98c379; }
    .tag-purple { fill: #c678dd; }
    .punc { fill: #abb2bf; }
    
    .indicator { stroke: #e5c07b; stroke-width: 2.5; stroke-linecap: round; }

    @keyframes pulse-line {
      0% { opacity: 0.5; filter: drop-shadow(0 0 2px #FFD700); }
      100% { opacity: 1; filter: drop-shadow(0 0 6px #FFD700); }
    }
  </style>

  <!-- Background -->
  <rect class="bg" width="1000" height="370" rx="12" />

  <!-- Garis Pemisah Tengah -->
  <line x1="425" y1="20" x2="425" y2="350" class="divider-line">
    <animate attributeName="stroke-dashoffset" values="28; 0" dur="1.5s" repeatCount="indefinite" />
  </line>

  <!-- Animasi Lingkaran Mengalir -->
  <circle cx="425" cy="50" r="6" class="flow-dot">
    <animate attributeName="cy" values="20; 350" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" dur="2s" repeatCount="indefinite" />
  </circle>
  <circle cx="425" cy="110" r="5" class="flow-dot">
    <animate attributeName="cy" values="20; 350" dur="1.4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" dur="1.4s" repeatCount="indefinite" />
  </circle>
  <circle cx="425" cy="170" r="5.5" class="flow-dot">
    <animate attributeName="cy" values="20; 350" dur="1.8s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" dur="1.8s" repeatCount="indefinite" />
  </circle>
  <circle cx="425" cy="220" r="4.5" class="flow-dot">
    <animate attributeName="cy" values="20; 350" dur="1.2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <circle cx="425" cy="280" r="5" class="flow-dot">
    <animate attributeName="cy" values="20; 350" dur="1.6s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0; 1; 1; 0" dur="1.6s" repeatCount="indefinite" />
  </circle>

  <!-- SISI KIRI: PROFIL -->
  <line x1="45" y1="45" x2="45" y2="105" class="vertical-line-accent" filter="url(#glow-yellow)" />
  <line x1="45" y1="105" x2="45" y2="325" stroke="#1c2128" stroke-width="1.5" />

  <!-- Nama -->
  <text x="68" y="75" class="name-heading">Firman Aprilian Sugiharto</text>
  
  <!-- Fullstack Engineer & Kursor (Disesuaikan posisinya) -->
  <text x="68" y="123" class="title-sub">Fullstack Engineer</text>
  <rect x="330" y="103" width="3.5" height="25" rx="1" fill="#FFD700" filter="url(#glow-yellow)">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite" />
  </rect>

  <!-- Skill Stack Tree Structure (Disesuaikan jarak vertikal antar baris) -->
  <text x="68" y="160" class="tree-text tree-folder">skill-stack/</text>
  <text x="68" y="184" class="tree-text">├── <tspan class="tree-folder">Go/</tspan></text>
  <text x="68" y="208" class="tree-text">├── <tspan class="tree-folder">TypeScript/</tspan></text>
  <text x="68" y="232" class="tree-text">├── <tspan class="tree-folder">React.js/</tspan></text>
  <text x="68" y="256" class="tree-text">├── <tspan class="tree-folder">Next.js/</tspan></text>
  <text x="68" y="280" class="tree-text">└── <tspan class="tree-folder">PostgreSQL/</tspan></text>

  <!-- Footer Kiri -->
  <text x="68" y="320" class="sub-footer">BACKEND // FRONTEND // DATABASE</text>
  <text x="375" y="320" class="sub-footer">01</text>

  <!-- SISI KANAN: CODE EDITOR -->
  
  <!-- === Backend Section === -->
  <text x="470" y="35" class="path-title">backend › internal › services › device_event.go</text>

  <text x="495" y="60" class="line-num">7</text>
  <text x="525" y="60" class="code-text">
    <tspan class="kw-pink">type</tspan> <tspan class="type-yellow">DeviceStatusChangedEvent</tspan> <tspan class="kw-pink">struct</tspan> <tspan class="punc">{</tspan>
  </text>

  <text x="495" y="83" class="line-num">8</text>
  <line x1="505" y1="71" x2="505" y2="85" class="indicator" />
  <text x="550" y="83" class="code-text field-orange">Type</text>
  <text x="640" y="83" class="code-text type-cyan">string</text>
  <text x="820" y="83" class="code-text tag-purple">`json:"type"`</text>

  <text x="495" y="106" class="line-num">9</text>
  <line x1="505" y1="94" x2="505" y2="108" class="indicator" />
  <text x="550" y="106" class="code-text field-orange">DeviceID</text>
  <text x="640" y="106" class="code-text type-cyan">string</text>
  <text x="820" y="106" class="code-text tag-purple">`json:"device_id"`</text>

  <text x="495" y="129" class="line-num">10</text>
  <line x1="505" y1="117" x2="505" y2="131" class="indicator" />
  <text x="550" y="129" class="code-text field-orange">Status</text>
  <text x="640" y="129" class="code-text"><tspan class="punc">models.</tspan><tspan class="type-yellow">DeviceStatus</tspan></text>
  <text x="820" y="129" class="code-text tag-purple">`json:"status"`</text>

  <text x="495" y="152" class="line-num">11</text>
  <text x="525" y="152" class="code-text punc">}</text>

  <!-- === Frontend Section === -->
  <text x="470" y="200" class="path-title">frontend › src › types › device.ts</text>

  <text x="495" y="225" class="line-num">19</text>
  <text x="525" y="225" class="code-text">
    <tspan class="kw-pink">export interface</tspan> <tspan class="type-yellow">DeviceStatusChangedEvent</tspan> <tspan class="punc">{</tspan>
  </text>

  <text x="495" y="248" class="line-num">20</text>
  <line x1="505" y1="236" x2="505" y2="250" class="indicator" />
  <text x="550" y="248" class="code-text">
    <tspan class="field-orange">type</tspan><tspan class="punc">:</tspan> <tspan class="str-green">"DEVICE_STATUS_CHANGED"</tspan><tspan class="punc">;</tspan>
  </text>

  <text x="495" y="271" class="line-num">21</text>
  <line x1="505" y1="259" x2="505" y2="273" class="indicator" />
  <text x="550" y="271" class="code-text">
    <tspan class="field-orange">device_id</tspan><tspan class="punc">:</tspan> <tspan class="type-cyan">string</tspan><tspan class="punc">;</tspan>
  </text>

  <text x="495" y="294" class="line-num">22</text>
  <line x1="505" y1="282" x2="505" y2="296" class="indicator" />
  <text x="550" y="294" class="code-text">
    <tspan class="field-orange">status</tspan><tspan class="punc">:</tspan> <tspan class="type-yellow">DeviceStatus</tspan><tspan class="punc">;</tspan>
  </text>

  <text x="495" y="317" class="line-num">23</text>
  <text x="525" y="317" class="code-text punc">}</text>

</svg>
