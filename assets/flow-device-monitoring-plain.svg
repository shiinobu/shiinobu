<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="398" viewBox="0 0 800 398" role="img" aria-labelledby="t d">
<title id="t">Device Monitoring System: components and step order</title>
<desc id="d">Step 1: the simulator sends a heartbeat every 10 seconds. Step 2: the heartbeat handler saves last_seen and sets ONLINE. Step 3: the status monitor checks every 5 seconds. Step 4: after more than 30 seconds without a heartbeat it sets OFFLINE. Step 5: the WebSocket hub broadcasts DEVICE_STATUS_CHANGED. Step 6: the Next.js dashboard updates its list and counters without a page refresh. PostgreSQL stores devices and users.</desc>
<path d="M170,85 H252" fill="none" stroke="#666666" stroke-width="1.5"/>
<path d="M548,279 H630" fill="none" stroke="#666666" stroke-width="1.5"/>
<path d="M400,328 V346" fill="none" stroke="#666666" stroke-width="1.5"/>
<rect x="10" y="37" width="160" height="96" rx="2" fill="#f5f5f5" stroke="#666666" stroke-width="1.2"/>
<text x="22" y="57" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f1f1f" text-anchor="start" xml:space="preserve">Device (simulator)</text>
<circle cx="32" cy="80" r="9" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="32" y="84" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f1f1f">1</text>
<text x="48" y="84" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">sends a heartbeat</text>
<text x="48" y="100" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">every 10 s</text>
<text x="22" y="122" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start" xml:space="preserve">5 simulated devices</text>
<rect x="240" y="10" width="320" height="318" rx="2" fill="#dae8fc" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="252" y="32" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#1f1f1f" text-anchor="start" xml:space="preserve">Go backend (Gin)</text>
<rect x="252" y="48" width="296" height="74" rx="2" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="264" y="66" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f1f1f" text-anchor="start" xml:space="preserve">Heartbeat handler</text>
<text x="264" y="84" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">POST /api/v1/devices/:device_id/heartbeat</tspan></text>
<circle cx="274" cy="103" r="9" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="274" y="107" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f1f1f">2</text>
<text x="290" y="107" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">saves <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">last_seen</tspan>, sets ONLINE</text>
<rect x="252" y="130" width="296" height="104" rx="2" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="264" y="148" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f1f1f" text-anchor="start" xml:space="preserve">Status monitor</text>
<circle cx="274" cy="167" r="9" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="274" y="171" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f1f1f">3</text>
<text x="290" y="171" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">checks every 5 s <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">STATUS_CHECK_INTERVAL</tspan></text>
<circle cx="274" cy="195" r="9" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="274" y="199" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f1f1f">4</text>
<text x="290" y="199" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">no heartbeat for more than 30 s:</text>
<text x="290" y="215" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">sets OFFLINE <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">HEARTBEAT_TIMEOUT</tspan></text>
<rect x="252" y="242" width="296" height="74" rx="2" fill="#ffffff" stroke="#6c8ebf" stroke-width="1.2"/>
<text x="264" y="260" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1f1f1f" text-anchor="start" xml:space="preserve">WebSocket hub</text>
<text x="264" y="278" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve"><tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">GET /api/v1/ws</tspan></text>
<circle cx="274" cy="297" r="9" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="274" y="301" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f1f1f">5</text>
<text x="290" y="301" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">broadcasts <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5">DEVICE_STATUS_CHANGED</tspan></text>
<rect x="630" y="233" width="160" height="92" rx="2" fill="#d5e8d4" stroke="#82b366" stroke-width="1.2"/>
<text x="642" y="253" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f1f1f" text-anchor="start" xml:space="preserve">Dashboard (Next.js)</text>
<circle cx="652" cy="277" r="9" fill="#ffffff" stroke="#666666" stroke-width="1.2"/><text x="652" y="281" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1f1f1f">6</text>
<text x="668" y="281" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">list and counters</text>
<text x="668" y="297" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">update without a</text>
<text x="668" y="313" font-family="Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#1f1f1f" text-anchor="start" xml:space="preserve">page refresh</text>
<rect x="320" y="346" width="160" height="42" rx="2" fill="#e1d5e7" stroke="#9673a6" stroke-width="1.2"/>
<text x="400" y="364" font-family="Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#1f1f1f" text-anchor="middle" xml:space="preserve">PostgreSQL</text>
<text x="400" y="380" font-family="Helvetica, Arial, sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="middle" xml:space="preserve">devices, users</text>
</svg>
